version: '3.8'

services:
  banking-assistant:
    build: .
    container_name: banking-assistant
    ports:
      - "8501:8501"
    environment:
      # Set your API credentials here
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      # Optional settings
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_RUNONCEONCE=false
    volumes:
      # Persist database
      - ./bank_data.db:/app/bank_data.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Usage:
# 1. Copy .env.example to .env and set your API credentials
# 2. Run: docker-compose up --build
# 3. Open: http://localhost:8501
